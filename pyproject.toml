[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-trace-evaluator"
version = "0.1.0"
description = "Confidence-gated JEV evaluation of agent traces with security and guardrail checks"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
jev = ["langchain-typesafe==0.0.1a3"]
test = ["pytest>=8,<10"]

[project.scripts]
jev-eval = "jev_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jev_eval = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
